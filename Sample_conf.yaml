substitutions:
  device_name: kaisai-ph
  humanly_name: Kaisai PRO HEAT+
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  recovery_pass: !secret recovery_pass
  ota_pass: !secret ota_pass
  api_key: !secret api_key
  # UART piny pre SLWF-01Pro v2.1 (ESP-12E):
  uart_rx: GPIO14
  uart_tx: GPIO12
  # LED sa využijú len po odkomentovaní packages/leds.yaml (piny nižšie sú orientačné):
  receive_led: GPIO2
  transmit_led: GPIO2

packages:
  remote_package:
    url: https://github.com/Nortonko/kaisai_PRO-HEAT.git
    ref: master
    files:
    # v - zarovnaj pod túto značku
      - packages/core.yaml
    refresh: 30s

esp8266:
  board: esp12e
