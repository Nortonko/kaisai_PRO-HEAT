# ============================================================
# Ukážkový config pre Kaisai PRO HEAT+ cez komponent kaisai_ac
# Hardvér: SMLIGHT SLWF-01Pro v2.1 (ESP8266, 5V UART shifter)
#
# Zapojenie na konektor CN16 klimatizácie:
#   CN16 +5V   -> SLWF +5V
#   CN16 GND   -> SLWF GND
#   CN16 TX    -> SLWF RX (GPIO14)   (stavový vodič z AC)
#   CN16 RX    -> SLWF TX (GPIO12)   (povely do AC)
# SLWF má na doske prevodník úrovní, takže 5V vstup AC dostane
# správnu úroveň (priame 3.3V z ESP by AC nepočul).
# ============================================================

substitutions:
  device_name: kaisai-ph
  humanly_name: Kaisai PRO HEAT+

esphome:
  name: "${device_name}"
  friendly_name: "${humanly_name}"

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Kaisai-Fallback"
    password: !secret recovery_pass

captive_portal:

logger:
  baud_rate: 0            # UART je obsadený komunikáciou s klimatizáciou

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pass

# --- externý komponent ---
external_components:
  - source:
      type: git
      url: https://github.com/Nortonko/kaisai_PRO-HEAT
      ref: v1.0.0          
    components: [kaisai_ac]

# --- UART do klimatizácie ---
uart:
  id: ac_uart
  rx_pin: GPIO14
  tx_pin: GPIO12
  baud_rate: 115200
  rx_buffer_size: 512

# --- hlavná climate entita ---
climate:
  - platform: kaisai_ac
    id: kaisai
    name: None             # prevezme friendly_name zariadenia
    uart_id: ac_uart
    poll_interval: 2s

# --- binárne funkcie ---
switch:
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: eco
    name: "ECO"
    icon: mdi:leaf
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: sleep
    name: "Sleep"
    icon: mdi:power-sleep
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: health
    name: "Health"
    icon: mdi:air-purifier
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: anti_mildew
    name: "Anti-mildew"
    icon: mdi:weather-fog

# --- ventilátor a polohy lamiel (ako select entity) ---
select:
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    target: fan
    name: "Ventilátor"
    icon: mdi:fan
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    target: vane_vertical
    name: "Vertikálna lamela"
    icon: mdi:arrow-up-down
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    target: vane_horizontal
    name: "Horizontálna lamela"
    icon: mdi:arrow-left-right

# --- doplnkové diagnostické senzory (voliteľné) ---
sensor:
  - platform: wifi_signal
    name: "WiFi signál"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
