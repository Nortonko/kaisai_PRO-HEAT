# ============================================================
# Ukážkový config pre Kaisai PRO HEAT+ cez komponent kaisai_ac
# Hardvér: SMLIGHT SLWF-01Pro v2.1 (ESP8266, 5V UART shifter)
#
# Zapojenie na konektor CN16 klimatizácie:
#   CN16 +5V   -> SLWF +5V
#   CN16 GND   -> SLWF GND
#   CN16 TX    -> SLWF RX (GPIO14)   (stavový vodič z AC)
#   CN16 RX    -> SLWF TX (GPIO12)   (povely do AC)
# SLWF má na doske prevodník úrovní, takže 5V vstup AC dostane
# správnu úroveň (priame 3.3V z ESP by AC nepočul).
# ============================================================

substitutions:
  device_name: kaisai-ph
  humanly_name: Kaisai PRO HEAT+

esphome:
  name: "${device_name}"
  friendly_name: "${humanly_name}"

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Kaisai-Fallback"
    password: !secret recovery_pass

captive_portal:

logger:
  baud_rate: 0            # UART je obsadený komunikáciou s klimatizáciou

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pass

# --- externý komponent z tvojho forku ---
external_components:
  - source:
      type: git
      url: https://github.com/Nortonko/kaisai_PRO-HEAT
      ref: v1.0.0          # pripni na tag pre stabilitu
    components: [kaisai_ac]

# --- UART do klimatizácie ---
uart:
  id: ac_uart
  rx_pin: GPIO14
  tx_pin: GPIO12
  baud_rate: 115200
  rx_buffer_size: 512

# --- hlavná climate entita ---
climate:
  - platform: kaisai_ac
    id: kaisai
    name: None             # prevezme friendly_name zariadenia
    uart_id: ac_uart
    poll_interval: 2s
    republish_interval: 30s   # znovu odoslať celý stav do HA každých 30 s

# --- binárne funkcie ---
switch:
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: eco
    name: "ECO"
    icon: mdi:leaf
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: sleep
    name: "Sleep"
    icon: mdi:power-sleep
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: health
    name: "Health"
    icon: mdi:air-purifier
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: anti_mildew
    name: "Anti-mildew"
    icon: mdi:weather-fog
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: display
    name: "Displej"
    icon: mdi:television-ambient-light
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: beep
    name: "Pípanie"
    icon: mdi:volume-high
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    function: soft_wind
    name: "Jemný vietor"
    icon: mdi:weather-windy

# --- ventilátor a polohy lamiel (ako select entity) ---
select:
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    target: fan
    name: "Ventilátor"
    icon: mdi:fan
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    target: vane_vertical
    name: "Vertikálna lamela"
    icon: mdi:arrow-up-down
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    target: vane_horizontal
    name: "Horizontálna lamela"
    icon: mdi:arrow-left-right

# --- diagnostické senzory ---
# Poznámka: netreba žiadne heartbeat/timeout filtre — komponent sám periodicky
# znovu odosiela stav (viď republish_interval vyššie), takže senzory nezostarnú.
sensor:
  # Pole 0x64 = otáčky ventilátora vonkajšej jednotky (RPM). Mení sa málo,
  # pri vypnutom ventilátore hlási 0.
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    type: fan_rpm              # pole 0x64 — otáčky ventilátora vonk. jednotky
    name: "Otáčky ventilátora vonk. jednotky"
    unit_of_measurement: "RPM"
    state_class: measurement
    icon: "mdi:fan"
  # Pole 0x65 = frekvencia kompresora (Hz). Hodnota je priamo v Hz (napr. 32 = 32 Hz).
  # V ustálenom chladení je stabilná; 0 znamená stojaci kompresor.
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    type: compressor_freq      # pole 0x65 — frekvencia kompresora
    name: "Frekvencia kompresora"
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    type: coil_temp_inner      # pole 0x5C — teplota vnútorného výmenníka
    name: "Teplota vnútorného výmenníka"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: kaisai_ac
    kaisai_ac_id: kaisai
    type: coil_temp_outer      # pole 0x60 — teplota vonkajšieho výmenníka
    name: "Teplota vonkajšieho výmenníka"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: wifi_signal
    name: "WiFi signál"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
