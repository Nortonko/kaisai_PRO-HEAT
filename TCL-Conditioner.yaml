substitutions:
# Jedinečný názov tejto konfigurácie. Používaj iba malé latinské písmená a číslice,
# žiadne medzery ani špeciálne znaky (napr. "kaisai-ph"). Ak budeš mať viac jednotiek,
# device_name odlíš, napr. kaisai-ph1, kaisai-ph2...
# POZOR na dĺžku: core.yaml z toho skladá SSID záložného hotspotu ako
# "{device_name} Fallback Hotspot". WiFi SSID má limit 32 znakov, teda device_name
# smie mať najviac 15 znakov.
  device_name: kaisai-ph
# Zobrazovaný názov jednotky (pre rozhranie Home Assistant):
  humanly_name: Kaisai PRO HEAT+
# Pripojenie na WiFi. Údaje môžu byť v súbore "secrets" v ESPHome, inak ich vpíš priamo:
# Názov (SSID) WiFi siete:
  wifi_ssid: !secret wifi_ssid
# Heslo WiFi siete:
  wifi_password: !secret wifi_password
# Heslo záložného prístupového bodu; jeho SSID bude: "{device_name} Fallback Hotspot"
  recovery_pass: !secret recovery_pass
# Heslo pre aktualizáciu firmvéru „vzduchom" (OTA). Vygeneruje sa raz a používa sa stále:
  ota_pass: !secret ota_pass
# Kľúč pre pripojenie k Home Assistant API. Nový kľúč: https://esphome.io/components/api.html
  api_key: !secret api_key
# UART piny modulu SLWF-01Pro v2.1 (ESP-12E) smerom ku klimatizácii.
# DÔLEŽITÉ: pre túto dosku sú to GPIO12/GPIO14 — NIE GPIO3/GPIO1 (tie sú pre ESP-01S)!
  uart_rx: GPIO14
  uart_tx: GPIO12
# Piny pre signalizačné LED. Fungujú len po odkomentovaní "leds" v sekcii "packages",
# inak sem môžeš napísať čokoľvek. (Pre tých, čo ich chceli odstrániť.)
  receive_led: GPIO2
  transmit_led: GPIO2

# Podgružované súbory — načítavajú a aktualizujú sa automaticky z internetu.
# Odkomentuj tie, ktoré chceš. Popis možností:
# - packages/leds.yaml        - LED indikácia príjmu/vysielania (piny v receive_led / transmit_led)
# - packages/bad_connect.yaml - 3-násobný pokus o odoslanie príkazu do jednotky (slabé spojenie)
# - packages/uart_speed.yaml  - prepínač rýchlosti UART; objaví sa v nastaveniach zariadenia
#
# Odkomentované riadky POVINNE zarovnaj pod uvedenú pozíciu!
packages:
  remote_package:
    url: https://github.com/Nortonko/kaisai_PRO-HEAT.git
    # Zafixované na tag v1.0.0 — upstream zmeny ti už nič nerozbijú.
    # Pri prechode na novšiu verziu zmeň tag a v repozitári vytvor príslušný git tag.
    ref: v1.0.1
    files:
    # v - zarovnanie riadkov s balíčkami vykonaj presne pod túto značku, inak to bude glitchovať
      - packages/core.yaml # Jadro všetkého
      # - packages/leds.yaml
      # - packages/bad_connect.yaml
      # - packages/uart_speed.yaml
    refresh: 30s

# Zvolený modul, do ktorého sa tento firmvér flashuje.
# Pre SMLIGHT SLWF-01Pro v2.1 je to ESP8266 / ESP-12E:
esp8266:
  board: esp12e

# --- Príklady iných platforiem (ak by si menil hardvér) ---
# ESP-01S:
#esp8266:
# board: esp01_1m
#
# Hommyn HDN/WFN-02-01 (z pôvodného článku):
#esp32:
# board: esp32-c3-devkitm-1
# framework:
# type: arduino

# Stavová LED. Zapni podľa potreby, ak máš voľné piny:
#status_led:
# pin:
# number: GPIO5
# inverted: false
